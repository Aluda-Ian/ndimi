{% extends "admin/base.html" %}

{% block title %}{{ title }} | Ndimi control room{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
:root {
  --ndimi-ink: #17211f;
  --ndimi-muted: #63706b;
  --ndimi-teal: #0b6e66;
  --ndimi-teal-dark: #075149;
  --ndimi-mint: #d7ece8;
  --ndimi-gold: #e9a21b;
  --ndimi-paper: #f4f6f2;
}
body { background: var(--ndimi-paper); color: var(--ndimi-ink); }
#header {
  background: var(--ndimi-ink);
  color: #f4f6f2;
  padding: 18px 32px;
  border-bottom: 4px solid var(--ndimi-gold);
}
#branding h1, #branding h1 a:link, #branding h1 a:visited {
  color: #fff;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -.02em;
}
#branding h1::before {
  content: "N";
  display: inline-grid;
  place-items: center;
  width: 26px;
  height: 26px;
  margin-right: 9px;
  border: 2px solid var(--ndimi-gold);
  border-radius: 7px;
  color: var(--ndimi-gold);
  font-size: 15px;
}
#user-tools { color: #b9c8c2; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
#user-tools a:link, #user-tools a:visited { color: #f5c965; }
#user-tools a:hover { color: #fff; }
div.breadcrumbs { background: #fff; border-bottom: 1px solid #dbe1db; color: var(--ndimi-muted); padding: 14px 32px; }
div.breadcrumbs a { color: var(--ndimi-teal); }
#content { max-width: 1320px; margin: 0 auto; padding: 28px 32px 56px; }
#content h1 { color: var(--ndimi-ink); font-size: 30px; letter-spacing: -.03em; }
.module, .inline-group, .submit-row, fieldset.module {
  border: 1px solid #dbe1db;
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(23, 33, 31, .05);
  overflow: hidden;
}
.module h2, .module caption, .inline-group h2 { background: var(--ndimi-teal); color: #fff; font-weight: 700; padding: 12px 16px; }
.module table th { color: var(--ndimi-muted); }
.module table td, .module table th { padding: 12px 14px; }
a:link, a:visited { color: var(--ndimi-teal); }
.button, input[type=submit], input[type=button], .submit-row input, a.button { background: var(--ndimi-teal); border-radius: 7px; border: 0; font-weight: 700; }
.button:hover, input[type=submit]:hover, input[type=button]:hover, .submit-row input:hover, a.button:hover { background: var(--ndimi-teal-dark); }
input, textarea, select, .selector select { border-color: #cbd5cf; border-radius: 6px; }
input:focus, textarea:focus, select:focus { border-color: var(--ndimi-teal); box-shadow: 0 0 0 2px var(--ndimi-mint); }
.object-tools a:link, .object-tools a:visited { background: var(--ndimi-gold); color: var(--ndimi-ink); border-radius: 7px; }
.object-tools a:hover { background: #f5bd3c; }
#nav-sidebar { border-right: 1px solid #dbe1db; background: #fff; }
.ndimi-welcome { display: flex; justify-content: space-between; gap: 20px; align-items: end; background: var(--ndimi-ink); color: #fff; border-radius: 12px; padding: 24px 26px; margin-bottom: 24px; }
.ndimi-welcome h2 { margin: 0 0 6px; font-size: 25px; letter-spacing: -.02em; }
.ndimi-welcome p { margin: 0; color: #b9c8c2; max-width: 58ch; }
.ndimi-welcome .tag { color: #17211f; background: var(--ndimi-gold); border-radius: 999px; padding: 7px 12px; font-size: 12px; font-weight: 700; white-space: nowrap; }
@media (max-width: 700px) {
  #header { padding: 16px 18px; }
  #content { padding: 20px 16px 40px; }
  div.breadcrumbs { padding: 12px 18px; }
  #user-tools { margin-top: 10px; }
  .ndimi-welcome { display: block; }
  .ndimi-welcome .tag { display: inline-block; margin-top: 16px; }
}
</style>
{% endblock %}

{% block branding %}
<h1 id="site-name"><a href="{% url 'admin:index' %}">Ndimi <span style="font-weight:400;color:#b9c8c2">control room</span></a></h1>
{% endblock %}

{% block nav-global %}
<div style="padding: 10px 32px; background:#0f1716; border-bottom:1px solid #293633; font-size:13px;">
  <a href="{% url 'home' %}" style="color:#d7ece8;text-decoration:none;font-weight:600;">Open Ndimi workspace</a>
  <span style="color:#60706b;margin:0 10px;">/</span>
  <span style="color:#9eada7;">Platform configuration</span>
</div>
{% endblock %}
