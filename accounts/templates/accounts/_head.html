<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#EDEFEA; --surface:#FFFFFF; --ink:#15171C; --muted:#5E636B; --line:#D9DCD4;
  --brand:#0B6E66; --brand-soft:#D7ECE8; --brand-ink:#FFFFFF;
  --accent:#E9A21B; --accent-soft:#FBEFD2; --danger:#B42318; --danger-soft:#FDE8E6;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#101312; --surface:#181C1B; --ink:#ECEEEA; --muted:#9AA09C; --line:#2A302E;
    --brand:#3FB7A9; --brand-soft:#173532; --brand-ink:#0C1211;
    --accent:#F2B745; --accent-soft:#3A2E14; --danger:#F97066; --danger-soft:#3A1714;
  }
}
:root[data-theme="dark"]{
  --canvas:#101312; --surface:#181C1B; --ink:#ECEEEA; --muted:#9AA09C; --line:#2A302E;
  --brand:#3FB7A9; --brand-soft:#173532; --brand-ink:#0C1211;
  --accent:#F2B745; --accent-soft:#3A2E14; --danger:#F97066; --danger-soft:#3A1714;
}
*,*::before,*::after{box-sizing:border-box}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mark{display:flex;align-items:center;gap:3px;height:28px}
.mark i{display:block;width:4px;border-radius:2px;background:var(--brand)}
.mark i:nth-child(1){height:10px}.mark i:nth-child(2){height:22px}.mark i:nth-child(3){height:28px;background:var(--accent)}.mark i:nth-child(4){height:16px}.mark i:nth-child(5){height:8px}
.brand b{font:700 21px/1 var(--display);letter-spacing:-.01em}
.brand small{display:block;font-size:12px;color:var(--muted);margin-top:3px}
h1{font:700 26px/1.15 var(--display);letter-spacing:-.02em;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 20px;font-size:15px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--canvas);font:inherit;color:inherit}
.help{font-size:13px;color:var(--muted);margin-top:5px}
.help ul{margin:4px 0 0;padding-left:18px}
.err{font-size:13px;color:var(--danger);margin-top:5px}
.alert{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.btn{width:100%;cursor:pointer;border:0;border-radius:10px;padding:12px 20px;font:600 16px/1.2 var(--body);background:var(--brand);color:var(--brand-ink);margin-top:6px}
.alt{text-align:center;font-size:14px;color:var(--muted);margin:18px 0 0}
.alt a{color:var(--brand);font-weight:600;text-decoration:none}
.card.wide{width:min(560px,100%)}
.lead a,.help a{color:var(--brand);font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;font-size:15px}
.check input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--brand);flex:none}
.msg{border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px;background:var(--brand-soft);color:var(--ink)}
.msg.error,.msg.warning{background:var(--danger-soft);color:var(--danger)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn.inline{width:auto;margin:0}
section.block{border-top:1px solid var(--line);padding-top:20px;margin-top:24px}
section.block h2{font:700 18px/1.2 var(--display);margin:0 0 6px}
section.block p{margin:0 0 12px;color:var(--muted);font-size:14px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;margin-left:6px;vertical-align:middle}
.badge.ok{background:var(--brand-soft);color:var(--ink)}
.badge.no{background:var(--accent-soft);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row form{margin:0}
.topnav{display:flex;justify-content:space-between;align-items:center;margin:-6px 0 18px;font-size:14px}
.topnav a{color:var(--brand);font-weight:600;text-decoration:none}

.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
</style>
