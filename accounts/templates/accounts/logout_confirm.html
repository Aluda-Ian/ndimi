{% extends "accounts/base.html" %}
{% block title %}Sign out{% endblock %}
{% block content %}
<h1>Sign out?</h1>
<p class="lead">You're signed in as <b>{{ user.get_username }}</b>.</p>
<form method="post">{% csrf_token %}<button class="btn" type="submit">Sign out</button></form>
<p class="alt"><a href="{% url 'home' %}">Stay signed in</a></p>
{% endblock %}
