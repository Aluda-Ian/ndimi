{% extends "accounts/base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<h1>Reset your password</h1>
<p class="lead">Enter your account's email address. We'll send you a link to choose a new password.</p>
<form method="post" novalidate>
  {% csrf_token %}
  {% include "accounts/_fields.html" %}
  <button class="btn" type="submit">Send reset link</button>
</form>
<p class="alt"><a href="{% url 'login' %}">Back to sign in</a></p>
{% endblock %}
